name: Build plugins
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm-7]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build.sh "${{ matrix.arch }}"
      - name: Verify loading and notifications in official Gotify
        if: matrix.arch == 'amd64'
        run: python3 scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-webhook-linux-${{ matrix.arch }}
          path: build/*.so
